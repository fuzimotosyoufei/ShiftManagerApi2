<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理画面</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cleatecalendstyle.css">
</head>

<body>

    <div class="wrapper">

        <div class="plbutton-main">
            <button class="plbutton-button" onclick="switchPage('check')">📥 希望一覧 (Check)</button>
            <button class="plbutton-button" onclick="switchPage('build')">🛠️ シフト作成 (Build)</button>
        </div>

        <div class="main-content">

            <div id="page-check" class="content-check">
                <button class="btn-clear" onclick="alert('C#のデータ削除機能は後ほど実装します！')">データを全削除</button>
                <table id="shift_create" class="design01">
                    <tr id="shift_name">
                        <th>名前</th>

                    </tr>
                </table>
                <h1>📥 受信したシフト希望一覧（管理画面）</h1>
                <div id="admin-history-container"></div>
            </div>

            <div id="page-build" class="content-build">
                <h2>🛠️ シフト作成・チェック用画面</h2>
                <p style="text-align: center; color: #666;">ここに将来、カレンダーや組み立て機能を実装します！</p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
