<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理画面</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #eef2f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .shift-card {
            background: #fff;
            border: 1px solid #ddd;
            border-left: 6px solid #007bff;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .staff-name {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }

        .date-list {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .btn-clear {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
            font-weight: bold;
        }

        .text-message {
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            font-size: 14px;
            color: #555;

            width: 100%;
            /* 最初から横幅を画面いっぱいに広げる */
            white-space: pre-wrap;
            /* white-spaceこれ自動伸ばし */
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="btn-clear" onclick="alert('C#のデータ削除機能は後ほど実装します！')">データを全削除</button>
        <h1>📥 受信したシフト希望一覧（管理画面）</h1>
        <div id="admin-history-container">
        </div>
    </div>

    <script>
        // 画面が開いたら自動でデータを読み込む
        document.addEventListener('DOMContentLoaded', function () {
            loadShifts();
        });

        function loadShifts() {
            // 💡 通信成功したC#のポート「7123」に修正しました
            fetch('https://overplay-patriarch-daffodil.ngrok-free.dev/api/shift', {
                method: 'GET',
                headers: {
                    'ngrok-skip-browser-warning': 'true' // 👈 これを足すと、あの青い警告画面を強制スルーできます！
                }
            })
                .then(response => {//fatchの後に.thenを書くことでプログラム側が自動的に判断し.then(response)の中にfetchの結果を入れてくれるそれに.thenが終わるまで待ちその下にthenがある場合自動的に実行し変数が別になっても内容自体は自動的に引き継がれる
                    if (response.ok) {
                        return response.json();//送られてきたデータをjson形式にしているこれをしないとうまく処理できない
                    }
                    throw new Error('データの取得に失敗しました。');
                })
                .then(allShifts => {
                    // ⭕ ID名を「admin-history-container」に修正してガチッと一致させました！
                    const container = document.getElementById('admin-history-container');
                    container.innerHTML = '';//一回全部消している

                    if (allShifts.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:#999;">提出されたシフトはまだありません。</p>';
                        return;
                    }

                    // 届いたシフト（配列）をループしてカードを作る
                    allShifts.forEach(shift => {
                        const card = document.createElement('div');//四角い箱divを作り出している
                        card.className = 'shift-card';//普通なら単に分かりやす要に名前を付けるだけだけど事前にdivを作っておきかつcssに同じ名前のcssがあるなら自動でdivの中にcssでカードデザインを適応してくれる

                        const formattedDates = shift.dates.map(item => {
                            return `${item.date} , (${item.stamp})`;
                        }).join('<br>');

                        card.innerHTML = `
                            <div class="staff-name">👤 ${shift.name}</div>
                            <div class="date-list">
                                <strong>希望日：</strong><br>
                                ${formattedDates}
                            </div>
                            <div class="text-message">
                                ${shift.memo}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('エラー:', error);
                    alert('シフトデータの読み込みに失敗しました。');
                });
        }
    </script>
</body>

</html>
